<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - Automotive Shop</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .confirmation-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #2980b9;
        }
        p {
            color: #34495e;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h2>Confirm Your Order</h2>
        <p>Product: {{ product['name'] }}</p>
        <p>Price: ${{ product['price'] }}</p>
        <p>Payment Method: {{ payment_method|capitalize }}</p>
        <form method="POST">
            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" name="address" value="{{ user['address'] }}" required>
            </div>
            <button type="submit">Confirm Order</button>
        </form>
    </div>
</body>
</html>
