<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Automotive Shop</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #3498db;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .products-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            border-radius: 10px;
        }
        .product-card h3 {
            color: #2c3e50;
            margin: 10px 0;
        }
        .product-card a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        .product-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                {% if logged_in %}
                    <a href="{{ url_for('profile') }}">Profile</a>
                    <a href="{{ url_for('wishlist') }}">Wishlist</a>
                    <a href="{{ url_for('my_orders') }}">My Orders</a>
                    <a href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <div class="container">
        <h2>Search Results for "{{ query }}"</h2>
        <div class="products-list">
            {% for product in products %}
                <div class="product-card">
                    <img src="{{ url_for('static', filename='products/' + product['id']|string + '.jpg') }}" alt="{{ product['name'] }}">
                    <h3>{{ product['name'] }}</h3>
                    <p>Price: ${{ product['price'] }}</p>
                    <a href="{{ url_for('product', product_id=product['id']) }}">View Details</a>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>s
